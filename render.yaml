services:
  - type: web
    name: medora-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://medora-ai-psi.vercel.app
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: RAG_MIN_SCORE
        value: "0.45"
      - key: EMERGENCY_NUMBER
        value: "local emergency services"
      - key: ENABLE_DEMO
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: medora-db
    plan: free
